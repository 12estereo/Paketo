
name: Build OMNI MATRIX APK V3

on:
  workflow_dispatch:
  push:
    paths:
      - 'OMNI_MATRIX_SOURCE_FIXED_V3.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          test -f OMNI_MATRIX_SOURCE_FIXED_V3.zip || {
            echo "ERROR: ZIP no encontrado"
            exit 1
          }

      - name: Extract Android project
        run: |
          mkdir -p proyecto
          unzip -q OMNI_MATRIX_SOURCE_FIXED_V3.zip -d proyecto
          test -f proyecto/settings.gradle
          test -f proyecto/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OMNI-MATRIX-APK-V3
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
