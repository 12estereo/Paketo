
name: Build SLR PRO CAMERA APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS="$(find . -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' -print -quit)"

            if [ -n "$ZIP_FILE" ]; then
              mkdir -p extracted
              unzip -o "$ZIP_FILE" -d extracted
              SETTINGS="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"
            fi
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró el proyecto Android."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado en: $ROOT"

      - name: Build APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.root }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SLR-PRO-CAMERA-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
