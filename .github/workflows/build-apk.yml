
name: Build SLR PRO CAMERA APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Locate Android project
        id: project
        run: |
          PROJECT=$(find . -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            mkdir -p extracted
            ZIP=$(find . -maxdepth 3 -name '*.zip' -print -quit)
            if [ -n "$ZIP" ]; then
              unzip -o "$ZIP" -d extracted
              PROJECT=$(find extracted -type f \
                \( -name settings.gradle.kts -o -name settings.gradle \) \
                -print -quit)
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "No se encontró el proyecto Android."
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "root=$(dirname "$PROJECT")" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado: $PROJECT"

      - name: Build APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.root }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SLR-PRO-CAMERA-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
