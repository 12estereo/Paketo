name: Build SLR PRO CAMERA APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract project ZIP if needed
        shell: bash
        run: |
          if ! find . -type f \\( -name 'settings.gradle' -o -name 'settings.gradle.kts' \\) -not -path '*/.gradle/*' -print -quit | grep -q .; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "No se encontró settings.gradle(.kts) ni un ZIP del proyecto."
              exit 1
            fi
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted
          fi

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS="$(find . -type f \\( -name 'settings.gradle.kts' -o -name 'settings.gradle' \\) -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "No se encontró settings.gradle(.kts)."
            exit 1
          fi
          ROOT="$(dirname "$SETTINGS")"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Proyecto: $ROOT"

      - name: Build APK (retry on temporary repository errors)
        shell: bash
        run: |
          ROOT="${{ steps.project.outputs.root }}"
          for attempt in 1 2 3 4; do
            echo "Intento de compilación $attempt de 4"
            if gradle --no-daemon --max-workers=2 -p "$ROOT" assembleDebug; then
              echo "Compilación exitosa."
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              WAIT=$((attempt * 30))
              echo "La compilación falló. Esperando ${WAIT}s antes de reintentar..."
              sleep "$WAIT"
            fi
          done

          echo "La compilación falló después de 4 intentos."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SLR-PRO-CAMERA-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
